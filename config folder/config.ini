## Bundled example dataset
data_path = data/SAGE-SCIA-OMPS.nc
o3_var = ozone
o3_var_unit = Number Density [molec/cm³]
time_var = time
time_dim = 1
time_format = %Y%m

## Non-time dimensions of ozone(time, alt, lat)
additional_var_2_tag = alt
additional_var_2_unit = Altitude [m]
additional_var_3_tag = lat
additional_var_3_unit = Latitude [degrees_north]

## Analysis period and terms
start_date = 1985-01
end_date = 2024-12
trend_method = 1
intercept_method = 2
default_seasonal_component = 2
default_proxy_method = 1

## Inflection points and methods
inflection_point = 2000-01
inflection_method = pwl, ind

## Segment filters
filter_internal_fraction = 0.5
filter_fill_fraction = 0.7

## Names used to recognise dimensions
tag_name_lat = lat, latitude, latrange, lat_bands
tag_name_lon = lon, longitude, lonrange
tag_name_alt = alt, altitude, lev, level
tag_name_time = time, date

## Bundled proxy files
proxy_path = data/Proxies_Timeseries_202503.txt
aod_path = data/AOD_timeseries_1980-2022_10lat.txt
save_folder_path = save_folder